        const contestantsGrid = document.getElementById('contestantsGrid');
        const timelineContainer = document.getElementById('timelineContainer');
        const votacoesContainer = document.getElementById('votacoesContainer');
        const todasVotacoesContainer = document.getElementById('todasVotacoesContainer');
        const rankingList = document.getElementById('rankingList');
        const contestantCountSpan = document.getElementById('contestantCount');
        const heroCountSpan = document.getElementById('heroCount');
        const heroVotacoesSpan = document.getElementById('heroVotacoes');
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ========== FUNÇÕES DE SEO E META TAGS ==========
        function updateMetaTags(concorrente = null) {
            if (concorrente) {
                // Página específica do concorrente
                const title = `${concorrente.nome} | Secret Story Desafio Final`;
                const description = `Acompanha a participação de ${concorrente.nome} no Secret Story Desafio Final. ${concorrente.bio || 'Vê a timeline, votações, likes e team members.'}`;
                const image = concorrente.foto || 'https://i.imgur.com/favicon.png';
                const url = `https://${window.location.hostname}/concorrente/${concorrente.slug || concorrente.id}`;
                
                document.getElementById('metaTitle').setAttribute('content', title);
                document.title = title;
                document.getElementById('metaDescription').setAttribute('content', description);
                document.getElementById('ogTitle').setAttribute('content', title);
                document.getElementById('ogDescription').setAttribute('content', description);
                document.getElementById('ogImage').setAttribute('content', image);
                document.getElementById('twitterTitle').setAttribute('content', title);
                document.getElementById('twitterDescription').setAttribute('content', description);
                document.getElementById('twitterImage').setAttribute('content', image);
                document.getElementById('canonicalUrl').setAttribute('href', url);
                
                // Atualizar schema.org
                const schemaData = {
                    "@context": "https://schema.org",
                    "@type": "Person",
                    "name": concorrente.nome,
                    "description": description,
                    "image": image,
                    "url": url
                };
                document.getElementById('schemaData').innerHTML = JSON.stringify(schemaData);
            } else {
                // Página inicial
                document.getElementById('metaTitle').setAttribute('content', 'Secret Story • Desafio Final | Acompanha em Tempo Real');
                document.title = 'Secret Story • Desafio Final | Acompanha em Tempo Real';
                document.getElementById('metaDescription').setAttribute('content', 'Acompanha o Secret Story Desafio Final em tempo real. Vota, apoia a tua team, vê a timeline exclusiva e participa no chat com outros fãs.');
                document.getElementById('ogTitle').setAttribute('content', 'Secret Story • Desafio Final');
                document.getElementById('ogDescription').setAttribute('content', 'Acompanha em tempo real o reality show da TVI. Votações, timeline, chat e muito mais!');
                document.getElementById('canonicalUrl').setAttribute('href', `https://${window.location.hostname}/`);
                
                const schemaData = {
                    "@context": "https://schema.org",
                    "@type": "WebSite",
                    "name": "Secret Story Desafio Final",
                    "url": `https://${window.location.hostname}/`,
                    "description": "Acompanhamento comunitário do reality show Secret Story Desafio Final da TVI"
                };
                document.getElementById('schemaData').innerHTML = JSON.stringify(schemaData);
            }
        }
        
        // ========== FUNÇÕES DE PARTILHA ==========
        function shareApp() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({ title: 'Secret Story Desafio Final', text: 'Junta-te à comunidade!', url });
            } else {
                navigator.clipboard.writeText(url);
                alert('Link copiado! 📋 Partilha com os teus amigos.');
            }
        }
        
        function shareConcorrente(nome, slug) {
            const url = `https://${window.location.hostname}/concorrente/${slug}`;
            const text = `🎭 Apoia o/a ${nome} no Secret Story! Dá like e junta-te à team.`;
            if (navigator.share) {
                navigator.share({ title: `Apoia ${nome}`, text, url });
            } else {
                navigator.clipboard.writeText(url);
                alert('Link copiado! Partilha com os teus amigos.');
            }
        }
        
        // ========== CONCORRENTES ==========
        function loadContestants() {
            db.collection('concorrentes').onSnapshot(snapshot => {
                allContestants = [];
                snapshot.forEach(doc => {
                    allContestants.push({ 
                        id: doc.id, 
                        ...doc.data(), 
                        likes: doc.data().likes || 0, 
                        teamMembers: doc.data().teamMembers || 0,
                        slug: doc.data().slug || doc.id
                    });
                });
                contestantCountSpan.textContent = allContestants.length;
                heroCountSpan.textContent = allContestants.length;
                renderContestants();
                updateRankings();
                
                // Se temos slug na URL, abrir o modal automaticamente
                if (currentSlug && !currentModalContestant) {
                    const concorrente = allContestants.find(c => c.slug === currentSlug);
                    if (concorrente) {
                        setTimeout(() => openModal(concorrente.id), 500);
                        updateMetaTags(concorrente);
                    } else {
                        updateMetaTags(null);
                    }
                } else if (!currentSlug) {
                    updateMetaTags(null);
                }
            });
        }
        
        function renderContestants() {
            if (allContestants.length === 0) {
                contestantsGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px;">🎭 A aguardar entrada...</div>';
                return;
            }
            contestantsGrid.innerHTML = allContestants.map(c => `
                <div class="contestant-card" onclick="openModal('${c.id}')">
                    <img src="${c.foto || 'https://via.placeholder.com/150'}" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:18px; margin-bottom:10px;" onerror="this.src='https://via.placeholder.com/150'">
                    <div style="font-weight:700;">${escapeHtml(c.nome)}</div>
                    <div style="font-size:0.7rem; color:#666; margin:6px 0;"><i class="fas fa-heart" style="color:#ff69b4;"></i> ${c.likes} | <i class="fas fa-users"></i> ${c.teamMembers}</div>
                    <div style="display: flex; gap: 6px;">
                        <button onclick="event.stopPropagation(); addLike('${c.id}')" class="btn-like" style="flex:1; padding:6px;"><i class="fas fa-heart"></i> Like</button>
                        <button onclick="event.stopPropagation(); joinTeam('${c.id}')" class="btn-team" style="flex:1; padding:6px;"><i class="fas fa-user-plus"></i> Team</button>
                        <button onclick="event.stopPropagation(); shareConcorrente('${escapeHtml(c.nome)}', '${c.slug}')" class="btn-like" style="flex:0.3; border-color:#3b82f6; color:#3b82f6;"><i class="fas fa-share-alt"></i></button>
                    </div>
                </div>
            `).join('');
        }
        
        window.addLike = async (id) => { 
            await db.collection('concorrentes').doc(id).update({ likes: firebase.firestore.FieldValue.increment(1) }); 
            if (navigator.vibrate) navigator.vibrate(30); 
        };
        
        window.joinTeam = async (id) => { 
            await db.collection('concorrentes').doc(id).update({ teamMembers: firebase.firestore.FieldValue.increment(1) }); 
            if (navigator.vibrate) navigator.vibrate(30); 
        };
        
        // ========== MODAL ==========
        window.openModal = async (id) => {
            const c = allContestants.find(c => c.id === id);
            if (!c) return;
            currentModalContestant = c;
            
            document.getElementById('modalFoto').src = c.foto || 'https://via.placeholder.com/400';
            document.getElementById('modalNome').innerText = c.nome;
            document.getElementById('modalLikes').innerText = c.likes;
            document.getElementById('modalTeam').innerText = c.teamMembers;
            document.getElementById('modalBio').innerHTML = c.bio || 'Sem bio ainda.';
            document.getElementById('modalRivalidade').innerHTML = c.rivalidades ? `<span style="background:#ff69b410; padding:6px 12px; border-radius:20px;"><i class="fas fa-fire"></i> ${escapeHtml(c.rivalidades)}</span>` : '';
            document.getElementById('modalLikeBtn').onclick = () => addLike(c.id);
            document.getElementById('modalTeamBtn').onclick = () => joinTeam(c.id);
            document.getElementById('modalShareBtn').onclick = () => shareConcorrente(c.nome, c.slug);
            
            const eventosSnap = await db.collection('timeline').orderBy('timestamp', 'desc').get();
            let eventosHtml = '';
            eventosSnap.forEach(doc => {
                const ev = doc.data();
                if (ev.concorrentesIds?.includes(c.nome) || ev.texto.includes(c.nome)) {
                    const data = ev.data || new Date(ev.timestamp?.toDate()).toLocaleDateString();
                    eventosHtml += `<div class="timeline-item"><div style="font-size:0.7rem; color:#999;">${data}</div><div>${escapeHtml(ev.texto)}</div></div>`;
                }
            });
            document.getElementById('modalTimeline').innerHTML = eventosHtml || '<div style="opacity:0.6;">Sem eventos</div>';
            
            const votacoesSnap = await db.collection('votacoes').get();
            let votacoesHtml = '';
            for (const docSnap of votacoesSnap.docs) {
                const v = docSnap.data();
                if ((v.concorrentesIds?.includes(c.nome) || v.opcoes?.includes(c.nome)) && v.ativa !== false) {
                    const votosSnap = await db.collection('votacoes').doc(docSnap.id).collection('votos').get();
                    const votosParaC = votosSnap.docs.filter(vt => vt.data().opcao === c.nome).length;
                    const total = votosSnap.size;
                    const percent = total ? Math.round(votosParaC/total*100) : 0;
                    votacoesHtml += `<div style="background:#f5f5f5; border-radius:16px; padding:12px; margin-bottom:12px;"><div style="font-weight:600;">🗳️ ${escapeHtml(v.pergunta)}</div><div style="margin-top:8px;"><div>${escapeHtml(c.nome)}: ${percent}% (${votosParaC} votos)</div><div style="background:#e0e0e0; border-radius:20px; height:6px;"><div style="width:${percent}%; height:100%; background:linear-gradient(90deg,#ff69b4,#9b2dff); border-radius:20px;"></div></div></div></div>`;
                }
            }
            document.getElementById('modalVotacoes').innerHTML = votacoesHtml || '<div style="opacity:0.6;">Não participa em votações ativas</div>';
            
            document.getElementById('contestantModal').classList.add('active');
            
            // Atualizar URL sem recarregar (history.pushState)
            if (c.slug && window.location.pathname !== `/concorrente/${c.slug}`) {
                const newUrl = `https://${window.location.hostname}/concorrente/${c.slug}`;
                window.history.pushState({ concorrenteId: c.id }, c.nome, newUrl);
                updateMetaTags(c);
            }
        };
        
        window.closeModal = () => {
            document.getElementById('contestantModal').classList.remove('active');
            currentModalContestant = null;
            if (window.location.pathname !== '/') {
                window.history.pushState({}, '', '/');
                updateMetaTags(null);
            }
        };
        
        // Voltar atrás com o botão do browser
        window.onpopstate = (event) => {
            if (window.location.pathname === '/') {
                closeModal();
            } else if (currentSlug) {
                const concorrente = allContestants.find(c => c.slug === currentSlug);
                if (concorrente) openModal(concorrente.id);
            }
        };
        
        // ========== TIMELINE ==========
        function loadTimeline() {
            db.collection('timeline').orderBy('timestamp', 'desc').limit(30).onSnapshot(snapshot => {
                if (snapshot.empty) {
                    timelineContainer.innerHTML = '<div style="text-align:center; opacity:0.6;">⏳ Aguardando eventos...</div>';
                    return;
                }
                let html = '';
                snapshot.forEach(doc => {
                    const ev = doc.data();
                    const data = ev.data || new Date(ev.timestamp?.toDate()).toLocaleDateString();
                    html += `<div class="timeline-item"><div style="font-size:0.7rem; color:#999;">${data}</div><div>${escapeHtml(ev.texto)}</div></div>`;
                });
                timelineContainer.innerHTML = html;
            });
        }
        
        // ========== VOTAÇÕES ==========
        async function renderVotacaoCard(v, votacaoId) {
            const card = document.createElement('div');
            card.className = 'glass-card';
            card.style.padding = '18px';
            
            const votosSnap = await db.collection('votacoes').doc(votacaoId).collection('votos').get();
            const contagem = {};
            votosSnap.forEach(vt => { contagem[vt.data().opcao] = (contagem[vt.data().opcao] || 0) + 1; });
            const total = votosSnap.size;
            
            let opcoesHtml = '';
            v.opcoes?.forEach(op => {
                const percent = total ? Math.round((contagem[op]||0)/total*100) : 0;
                opcoesHtml += `<div style="margin-bottom:12px;"><button data-opcao="${op.replace(/"/g, '&quot;')}" class="votar-opcao" style="width:100%; margin-bottom:4px;">${escapeHtml(op)}</button><div><div style="display:flex; justify-content:space-between; font-size:0.75rem;"><span>${escapeHtml(op)}</span><span>${percent}% (${contagem[op]||0})</span></div><div style="background:#e0e0e0; border-radius:20px; height:6px;"><div style="width:${percent}%; height:100%; background:linear-gradient(90deg,#ff69b4,#9b2dff); border-radius:20px;"></div></div></div></div>`;
            });
            
            const status = v.ativa === false ? '<span style="font-size:0.7rem; background:#ccc; padding:2px 10px; border-radius:20px;">Fechada</span>' : '<span style="font-size:0.7rem; background:#ff69b4; color:white; padding:2px 10px; border-radius:20px;">Ativa</span>';
            card.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;"><h3 style="font-weight:700;">🗳️ ${escapeHtml(v.pergunta)}</h3>${status}</div>${opcoesHtml}`;
            
            if (v.ativa !== false) {
                card.querySelectorAll('.votar-opcao').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const opcao = btn.getAttribute('data-opcao');
                        await db.collection('votacoes').doc(votacaoId).collection('votos').add({ opcao, timestamp: new Date(), deviceId });
                        if (navigator.vibrate) navigator.vibrate(30);
                        alert(`Voto registado: ${opcao}`);
                    });
                });
            }
            return card;
        }
        
        function loadVotacoes() {
            db.collection('votacoes').orderBy('criadoEm', 'desc').onSnapshot(async snapshot => {
                const todas = [];
                snapshot.forEach(doc => todas.push({ id: doc.id, ...doc.data() }));
                heroVotacoesSpan.textContent = todas.filter(v => v.ativa !== false).length;
                
                const ativas = todas.filter(v => v.ativa !== false);
                votacoesContainer.innerHTML = ativas.length ? '' : '<div class="glass-card" style="padding:24px; text-align:center;">🗳️ Sem votações ativas</div>';
                for (const v of ativas) votacoesContainer.appendChild(await renderVotacaoCard(v, v.id));
                
                todasVotacoesContainer.innerHTML = todas.length ? '' : '<div class="glass-card" style="padding:24px; text-align:center;">📋 Nenhuma votação</div>';
                for (const v of todas) todasVotacoesContainer.appendChild(await renderVotacaoCard(v, v.id));
            });
        }
        
        // ========== RANKINGS ==========
        function updateRankings() {
            const sortedByTeam = [...allContestants].sort((a,b) => (b.teamMembers||0) - (a.teamMembers||0));
            const sortedByLikes = [...allContestants].sort((a,b) => (b.likes||0) - (a.likes||0));
            renderRankingList(currentRankType === 'teams' ? sortedByTeam : sortedByLikes);
        }
        
        function renderRankingList(contestants) {
            if (!contestants.length) {
                rankingList.innerHTML = '<div style="text-align:center; padding:40px; opacity:0.6;">🎭 Sem concorrentes ainda</div>';
                return;
            }
            rankingList.innerHTML = contestants.map((c, idx) => {
                let rankClass = '';
                if (idx === 0) rankClass = 'top-1';
                else if (idx === 1) rankClass = 'top-2';
                else if (idx === 2) rankClass = 'top-3';
                const value = currentRankType === 'teams' ? (c.teamMembers || 0) : (c.likes || 0);
                const icon = currentRankType === 'teams' ? '<i class="fas fa-users"></i>' : '<i class="fas fa-heart" style="color:#ff69b4;"></i>';
                return `<div class="rank-item" onclick="openModal('${c.id}')"><div class="rank-number ${rankClass}">${idx + 1}</div><img src="${c.foto || 'https://via.placeholder.com/48'}" class="rank-avatar" onerror="this.src='https://via.placeholder.com/48'"><div class="rank-info"><div class="rank-name">${escapeHtml(c.nome)}</div><div class="rank-score">${icon} ${value}</div></div><div class="rank-value">${value}</div></div>`;
            }).join('');
        }
        
        document.getElementById('rankLikesBtn')?.addEventListener('click', () => {
            currentRankType = 'likes';
            document.getElementById('rankLikesBtn').classList.add('active');
            document.getElementById('rankTeamsBtn').classList.remove('active');
            document.getElementById('rankLikesBtn').style.background = 'linear-gradient(135deg, #ff69b4, #9b2dff)';
            document.getElementById('rankLikesBtn').style.color = 'white';
            document.getElementById('rankTeamsBtn').style.background = 'transparent';
            document.getElementById('rankTeamsBtn').style.color = '#666';
            updateRankings();
        });
        
        document.getElementById('rankTeamsBtn')?.addEventListener('click', () => {
            currentRankType = 'teams';
            document.getElementById('rankTeamsBtn').classList.add('active');
            document.getElementById('rankLikesBtn').classList.remove('active');
            document.getElementById('rankTeamsBtn').style.background = 'linear-gradient(135deg, #ff69b4, #9b2dff)';
            document.getElementById('rankTeamsBtn').style.color = 'white';
            document.getElementById('rankLikesBtn').style.background = 'transparent';
            document.getElementById('rankLikesBtn').style.color = '#666';
            updateRankings();
        });
        
        // ========== CHAT ==========
        function loadChat() {
            db.collection('chat').orderBy('timestamp', 'desc').limit(100).onSnapshot(snapshot => {
                const container = document.getElementById('chatMessages');
                if (snapshot.empty) {
                    container.innerHTML = '<div style="text-align:center; opacity:0.5; padding: 40px;">💬 Nenhuma mensagem. Sê o primeiro a falar!</div>';
                    return;
                }
                let html = '';
                const messages = [];
                snapshot.forEach(doc => messages.unshift({ ...doc.data(), id: doc.id }));
                messages.forEach(msg => {
                    const isOwn = msg.deviceId === deviceId;
                    html += `<div class="chat-message ${isOwn ? 'own' : ''}"><span class="message-nick" style="font-size:0.7rem; font-weight:600;">${escapeHtml(msg.nick)}</span><div class="message-text" style="font-size:0.9rem;">${escapeHtml(msg.texto)}</div><div class="message-time" style="font-size:0.55rem; opacity:0.6;">${new Date(msg.timestamp?.toDate()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div></div>`;
                });
                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;
            });
        }
        
        function showNickModal() {
            const modal = document.createElement('div');
            modal.className = 'nick-modal';
            modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;';
            modal.innerHTML = `<div style="background:white;border-radius:32px;padding:24px;width:100%;max-width:300px;"><h3 style="margin-bottom:8px;">✏️ Editar nome</h3><p style="font-size:0.75rem;color:#888;">Como queres aparecer no chat?</p><input type="text" id="newNickInput" maxlength="20" placeholder="Teu nome" value="${escapeHtml(currentUserNick)}" style="width:100%;padding:14px;border:1px solid #e0e0e0;border-radius:30px;margin:16px 0;font-size:1rem;"><div style="display:flex;gap:10px;"><button id="saveNickBtn" style="flex:1;background:linear-gradient(135deg,#ff69b4,#9b2dff);color:white;border:none;border-radius:40px;padding:12px;font-weight:600;">Guardar</button><button id="cancelNickBtn" style="flex:1;background:none;border:1px solid #ff69b4;border-radius:40px;padding:12px;color:#ff69b4;">Cancelar</button></div></div>`;
            document.body.appendChild(modal);
            document.getElementById('saveNickBtn').onclick = () => {
                const newNick = document.getElementById('newNickInput').value.trim();
                if (newNick && newNick.length <= 20) {
                    currentUserNick = newNick;
                    localStorage.setItem('chatNick', newNick);
                    document.getElementById('chatNickDisplay').innerText = newNick;
                }
                modal.remove();
            };
            document.getElementById('cancelNickBtn').onclick = () => modal.remove();
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        }
        
        window.sendMessage = async () => {
            const msgInput = document.getElementById('chatMsg');
            const msg = msgInput.value.trim();
            if (!msg) return;
            msgInput.value = '';
            await db.collection('chat').add({ nick: currentUserNick, texto: msg, timestamp: new Date(), deviceId });
            if (navigator.vibrate) navigator.vibrate(20);
            setTimeout(() => {
                const container = document.getElementById('chatMessages');
                if (container) container.scrollTop = container.scrollHeight;
            }, 50);
        };
        
        // ========== TABS ==========
        function initTabs() {
            document.querySelectorAll('.menu-item').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.getAttribute('data-tab');
                    document.querySelectorAll('.menu-item').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    document.getElementById(`tab-${tabId}`).classList.add('active');
                    if (tabId === 'chat') setTimeout(() => { const c = document.getElementById('chatMessages'); if (c) c.scrollTop = c.scrollHeight; }, 100);
                });
            });
        }
        
        // ========== INIT ==========
        document.getElementById('fabShare')?.addEventListener('click', shareApp);
        document.getElementById('editNickBtn')?.addEventListener('click', showNickModal);
        document.getElementById('chatNickDisplay').innerText = currentUserNick;
        
        window.shareConcorrente = shareConcorrente;
        
        loadContestants();
        loadTimeline();
        loadVotacoes();
        loadChat();
        initTabs();
        
        // Service Worker (PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js?v=' + Date.now())
                .then(reg => console.log('✅ Service Worker registado'))
                .catch(err => console.error('❌ Erro:', err));
        }
    </script>
</body>
</html>
