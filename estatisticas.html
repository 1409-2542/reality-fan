<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff69b4">
    <meta name="robots" content="index, follow">
    <title>Estatísticas • Secret Story | Rankings e Números</title>
    <meta name="description" content="Todas as estatísticas do Secret Story Desafio Final: likes, teams, nomeações, expulsões e muito mais.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 50%, #e0f2fe 100%);
            color: #1a1a2e;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #ff69b4 0%, #9b2dff 50%, #3b82f6 100%);
            padding: 20px 16px;
            border-radius: 0 0 32px 32px;
        }
        
        .gradient-bg h1 { color: white; font-size: 1.6rem; margin-bottom: 4px; }
        .gradient-bg p { color: rgba(255,255,255,0.85); font-size: 0.8rem; }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 16px;
            padding-bottom: 80px;
        }
        
        .card {
            background: white;
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #ff69b4;
            border-left: 4px solid #ff69b4;
            padding-left: 12px;
        }
        
        .ranking-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .ranking-item:hover {
            background: #f8f9fa;
        }
        
        .ranking-position {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff69b420, #9b2dff20);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
        }
        
        .ranking-position.top1 {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            color: white;
        }
        
        .ranking-position.top2 {
            background: linear-gradient(135deg, #c0c0c0, #a0a0a0);
            color: white;
        }
        
        .ranking-position.top3 {
            background: linear-gradient(135deg, #cd7f32, #b87333);
            color: white;
        }
        
        .ranking-avatar {
            width: 48px;
            height: 48px;
            border-radius: 24px;
            object-fit: cover;
        }
        
        .ranking-info {
            flex: 1;
        }
        
        .ranking-name {
            font-weight: 700;
        }
        
        .ranking-value {
            font-weight: 800;
            font-size: 1.1rem;
            color: #ff69b4;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f0f0f0;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #ff69b4, #9b2dff);
            color: white;
        }
        
        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 10px 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            z-index: 100;
        }
        
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            font-size: 0.65rem;
            color: #888;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            text-decoration: none;
        }
        
        .menu-item i { font-size: 1.3rem; }
        .menu-item.active { color: #ff69b4; background: rgba(255, 105, 180, 0.1); }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .stat-big {
            background: linear-gradient(135deg, #ff69b410, #9b2dff10);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-big-number {
            font-size: 2rem;
            font-weight: 800;
            color: #ff69b4;
        }
        
        .stat-big-label {
            font-size: 0.7rem;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="gradient-bg">
        <h1><i class="fas fa-chart-line"></i> Estatísticas</h1>
        <p>Números e rankings do Secret Story</p>
    </div>
    
    <div class="container">
        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" data-tab="likes">❤️ Mais Likes</button>
                <button class="tab-btn" data-tab="teams">👥 Maiores Teams</button>
                <button class="tab-btn" data-tab="nomeacoes">🗳️ Mais Nomeações</button>
            </div>
            
            <div id="rankingContainer"></div>
        </div>
        
        <div class="card">
            <h2><i class="fas fa-chart-simple"></i> Resumo da Edição</h2>
            <div class="stats-grid" id="resumoStats"></div>
        </div>
    </div>
    
    <div class="bottom-menu">
        <a href="index.html" class="menu-item">
            <i class="fas fa-home"></i><span>Início</span>
        </a>
        <a href="expulsoes.html" class="menu-item">
            <i class="fas fa-skull"></i><span>Expulsões</span>
        </a>
        <a href="nomeados-semana.html" class="menu-item">
            <i class="fas fa-list"></i><span>Nomeados</span>
        </a>
        <a href="estatisticas.html" class="menu-item active">
            <i class="fas fa-chart-simple"></i><span>Stats</span>
        </a>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDhLsFf02lCuSB1i6Wd-Jb-c28KcGVNDro",
            authDomain: "tvi-reality-b2cf7.firebaseapp.com",
            projectId: "tvi-reality-b2cf7",
            storageBucket: "tvi-reality-b2cf7.firebasestorage.app",
            messagingSenderId: "956824114157",
            appId: "1:956824114157:web:5205bcb8140875efeacde4"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let allContestants = [];
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function carregarConcorrentes() {
            const snapshot = await db.collection('concorrentes').get();
            allContestants = [];
            snapshot.forEach(doc => {
                allContestants.push({ id: doc.id, ...doc.data() });
            });
            
            // Carregar estatísticas de nomeações
            const nomeacoesSnap = await db.collection('eventos_estruturados')
                .where('tipo', '==', 'nomeacao')
                .get();
            
            const countNomeacoes = {};
            nomeacoesSnap.forEach(doc => {
                const evento = doc.data();
                if (evento.alvo) {
                    countNomeacoes[evento.alvo] = (countNomeacoes[evento.alvo] || 0) + 1;
                }
            });
            
            allContestants.forEach(c => {
                c.nomeacoes = countNomeacoes[c.nome] || 0;
            });
            
            mostrarRanking('likes');
            mostrarResumo();
        }
        
        function mostrarRanking(tipo) {
            let sorted = [];
            if (tipo === 'likes') {
                sorted = [...allContestants].sort((a,b) => (b.likes || 0) - (a.likes || 0));
            } else if (tipo === 'teams') {
                sorted = [...allContestants].sort((a,b) => (b.teamMembers || 0) - (a.teamMembers || 0));
            } else if (tipo === 'nomeacoes') {
                sorted = [...allContestants].sort((a,b) => (b.nomeacoes || 0) - (a.nomeacoes || 0));
            }
            
            const container = document.getElementById('rankingContainer');
            
            if (sorted.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px;">A carregar...</div>';
                return;
            }
            
            let html = '';
            sorted.slice(0, 10).forEach((c, idx) => {
                let rankClass = '';
                if (idx === 0) rankClass = 'top1';
                else if (idx === 1) rankClass = 'top2';
                else if (idx === 2) rankClass = 'top3';
                
                let value = 0;
                let icon = '';
                if (tipo === 'likes') {
                    value = c.likes || 0;
                    icon = '❤️';
                } else if (tipo === 'teams') {
                    value = c.teamMembers || 0;
                    icon = '👥';
                } else if (tipo === 'nomeacoes') {
                    value = c.nomeacoes || 0;
                    icon = '🗳️';
                }
                
                html += `
                    <div class="ranking-item" onclick="verConcorrente('${c.slug}')">
                        <div class="ranking-position ${rankClass}">${idx + 1}</div>
                        <img src="${c.foto || 'https://via.placeholder.com/48'}" class="ranking-avatar" onerror="this.src='https://via.placeholder.com/48'">
                        <div class="ranking-info">
                            <div class="ranking-name">${escapeHtml(c.nome)}</div>
                            <div style="font-size:0.7rem; color:#888;">${icon} ${value}</div>
                        </div>
                        <div class="ranking-value">${value}</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        async function mostrarResumo() {
            const expulsos = allContestants.filter(c => c.status === 'expulso').length;
            const ativos = allContestants.filter(c => c.status === 'ativo' || !c.status).length;
            const totalLikes = allContestants.reduce((sum, c) => sum + (c.likes || 0), 0);
            const totalTeams = allContestants.reduce((sum, c) => sum + (c.teamMembers || 0), 0);
            
            const container = document.getElementById('resumoStats');
            container.innerHTML = `
                <div class="stat-big">
                    <div class="stat-big-number">${allContestants.length}</div>
                    <div class="stat-big-label">Concorrentes</div>
                </div>
                <div class="stat-big">
                    <div class="stat-big-number">${ativos}</div>
                    <div class="stat-big-label">Activos</div>
                </div>
                <div class="stat-big">
                    <div class="stat-big-number">${expulsos}</div>
                    <div class="stat-big-label">Expulsos</div>
                </div>
                <div class="stat-big">
                    <div class="stat-big-number">${totalLikes}</div>
                    <div class="stat-big-label">Total Likes</div>
                </div>
                <div class="stat-big">
                    <div class="stat-big-number">${totalTeams}</div>
                    <div class="stat-big-label">Team Members</div>
                </div>
                <div class="stat-big">
                    <div class="stat-big-number">🏆</div>
                    <div class="stat-big-label">A decorrer</div>
                </div>
            `;
        }
        
        window.verConcorrente = (slug) => {
            if (slug) window.location.href = `/concorrente/${slug}`;
        };
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                mostrarRanking(btn.dataset.tab);
            });
        });
        
        carregarConcorrentes();
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
